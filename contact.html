<main>
    <div>
        <h1>Contact</h1>
        <form id="contactForm" onsubmit="return validateForm()" ><!--Since I will not send this anywhere else I will not include method=POST and action-->
            <div class="form-control">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name.." >
            </div>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email.." >
            </div>
            <div class="form-control">
                <label for="subject">Subject</label>
                <select name="subject" id="subject">
                    <option value="" selected hidden disabled>Select a subject</option>
                    <option value="bug">Bug report</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-control">
                <label >How did you find us?</label>
                <label class="pointer"><input type="radio" id="radio1" name="source" value="friend">Friend</label>
                <label class="pointer"><input type="radio" id="radio2" name="source" value="Social">Social Media</label>
                <label class="pointer"><input type="radio" id="radio3" name="source" value="search">Search engine</label>
                <label class="pointer"><input type="radio" id="radio4" name="source" value="other">Other</label>
            </div>
            <div class="form-control">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="write here.." style="height:200px"></textarea>
            </div>
            <div class="form-control">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

</main>
